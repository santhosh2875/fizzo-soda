<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fizzo | Fruit soda in nine loud flavours</title>
  <meta name="description" content="Fizzo is an invented fruit soda brand: nine flavours, real fruit and fine fizz. Spin the cans, build a box of three. A design demo.">
  <meta name="theme-color" content="#ffb300">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-loading">
  <a class="skip" href="#shop">Skip to the shop</a>

  <!-- The opening: fruit flies, a counter runs, then the logo opens the page. -->
  <div class="intro" id="intro">
    <canvas id="introView" aria-hidden="true"></canvas>
    <div class="intro-disc" id="introDisc" aria-hidden="true"><span id="introWord"></span></div>
    <button class="intro-skip" id="introSkip" type="button"></button>
    <p class="intro-note" id="introNote"></p>
    <p class="intro-count" aria-hidden="true"><span id="introCount">000</span><small>%</small></p>
  </div>

  <header class="top" id="top" data-tone="flavour">
    <a class="logo" href="#flavours" id="logo">
      <span class="logo-disc" aria-hidden="true" id="logoDisc"></span>
      <span class="logo-name"><b id="brandName"></b><small id="brandSub"></small></span>
    </a>
    <nav class="nav" id="nav" aria-label="Parts of the page">
      <a href="#flavours">Flavours</a>
      <a href="#inside">Inside</a>
      <a href="#shop">Shop</a>
      <a href="#range">Range</a>
      <a href="#faq">Q&amp;A</a>
      <a href="#join">Join</a>
    </nav>
    <div class="tools">
      <button class="sound" id="sound" type="button" aria-pressed="false">
        <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>Sound <b id="soundText">off</b></span>
      </button>
      <a class="basket" id="basket" href="#build">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9h16l-1.4 10.2a2 2 0 0 1-2 1.8H7.4a2 2 0 0 1-2-1.8L4 9zm4 0 3-6m5 6-3-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <b class="packs" id="packs" hidden>0</b>
        <span class="sr" id="basketText"></span>
      </a>
      <a class="cta" id="cta" href="#join"></a>
    </div>
  </header>

  <main>
    <h1 class="sr">Fizzo: fruit soda in nine flavours</h1>

    <!-- 1. The row of cans. The whole page takes the colour of the can in the middle. -->
    <section class="flavours" id="flavours" data-tone="flavour" aria-roledescription="carousel" aria-label="Flavours">
      <div class="rings" aria-hidden="true"></div>
      <canvas class="view" id="heroView" aria-hidden="true"></canvas>
      <div class="flav-copy">
        <p class="flav-name" id="flavName" aria-live="polite"></p>
        <p class="flav-tag" id="flavTag"></p>
        <div class="flav-nav">
          <button class="round" id="flavPrev" type="button" aria-label="Previous flavour"><span aria-hidden="true">←</span></button>
          <button class="round" id="flavNext" type="button" aria-label="Next flavour"><span aria-hidden="true">→</span></button>
        </div>
      </div>
      <p class="flav-no" id="flavNo" aria-hidden="true">01</p>
      <button class="autoplay" id="autoplay" type="button" aria-pressed="true"><i aria-hidden="true"></i><span id="autoplayText"></span></button>
      <p class="flav-hint" id="flavHint"></p>
    </section>

    <!-- 2. One can turns while four short chapters go by. -->
    <section class="inside" id="inside" data-tone="flavour" aria-label="What is inside a can">
      <div class="inside-pin">
        <p class="inside-no" id="insideNo" aria-hidden="true">01</p>
        <canvas class="view" id="insideView" aria-hidden="true"></canvas>
        <div class="chapters" id="chapters"></div>
        <div class="callouts" id="callouts" aria-hidden="true"></div>
        <ol class="steps" id="insideSteps"></ol>
        <p class="rate" id="rate" aria-hidden="true"><span id="rateLabel"></span><b id="rateNo">0.0</b><span id="rateUnit"></span></p>
      </div>
    </section>

    <!-- 3. The shop: nine cards, then the box of three. -->
    <section class="shop" id="shop" data-tone="paper">
      <header class="sec-head">
        <h2 id="shopTitle"></h2>
        <p id="shopHint"></p>
      </header>
      <div class="cards-wrap" id="cardsWrap">
        <div class="cards" id="cards"></div>
        <canvas class="view" id="shopView" aria-hidden="true"></canvas>
      </div>

      <div class="build" id="build" data-tone="night">
        <div class="build-copy">
          <p class="eyebrow" id="buildLabel"></p>
          <h2 id="buildTitle"></h2>
          <ul class="picks" id="picks"></ul>
          <p class="build-hint" id="buildHint"></p>
        </div>
        <div class="tray" id="tray">
          <div class="glow" aria-hidden="true"></div>
          <ol class="slots" id="slots" aria-hidden="true"><li>2</li><li>1</li><li>3</li></ol>
          <p class="drop" id="dropText" aria-hidden="true"></p>
          <canvas class="view" id="buildView" aria-hidden="true"></canvas>
          <div class="removes" id="removes"></div>
          <button class="checkout" id="checkout" type="button"></button>
          <p class="fine" id="buildFine"></p>
        </div>
      </div>
    </section>

    <!-- 4. All nine on a rail. Drag it and they swing. -->
    <section class="range" id="range" data-tone="paper">
      <header class="sec-head">
        <h2 id="rangeTitle"></h2>
        <p id="rangeHint"></p>
      </header>
      <div class="rail" id="rail" tabindex="0" role="group" aria-label="All nine cans hanging on a rail. Use the left and right arrow keys to move along it.">
        <canvas class="view" id="railView" aria-hidden="true"></canvas>
      </div>
      <div class="ruler" id="ruler" aria-hidden="true">
        <div class="ruler-track" id="rulerTrack"></div>
        <i class="ruler-mark"></i>
      </div>
      <p class="drag" id="rangeDrag" aria-hidden="true"></p>
    </section>

    <!-- 5. Questions. -->
    <section class="faq" id="faq" data-tone="paper">
      <div class="faq-head">
        <h2 id="faqTitle"></h2>
        <p id="faqText"></p>
      </div>
      <div class="qa" id="qa"></div>
    </section>

    <!-- 6. Sign up. -->
    <section class="join" id="join" data-tone="flavour">
      <canvas class="view" id="joinView" aria-hidden="true"></canvas>
      <div class="join-copy">
        <h2 id="joinTitle"></h2>
        <p id="joinText"></p>
        <form id="joinForm" novalidate>
          <label for="joinEmail" id="joinLabel"></label>
          <div class="field">
            <input id="joinEmail" name="email" type="email" autocomplete="email" inputmode="email" aria-describedby="joinMsg">
            <button type="submit" id="joinButton"></button>
          </div>
          <p class="form-msg" id="joinMsg" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="foot" id="foot" data-tone="night">
    <div class="shout" aria-hidden="true"><div class="shout-track" id="shout"></div></div>
    <div class="foot-grid">
      <div class="foot-brand">
        <span class="logo-disc" aria-hidden="true" id="footDisc"></span>
        <p id="footBrand"></p>
      </div>
      <nav aria-label="Explore">
        <h3>Explore</h3>
        <a href="#flavours">Flavours</a>
        <a href="#inside">Inside</a>
        <a href="#range">Range</a>
        <a href="#build">Build a box</a>
      </nav>
      <nav aria-label="Help">
        <h3>Help</h3>
        <a href="#faq">Q&amp;A</a>
        <a href="#join">Newsletter</a>
        <a id="footMail" href="#"></a>
      </nav>
      <div>
        <h3>Follow</h3>
        <div id="footFollow"></div>
      </div>
    </div>
    <div class="foot-end">
      <p id="footNote"></p>
      <a href="#flavours">Back to top ↑</a>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <canvas class="fly" id="flyView" aria-hidden="true"></canvas>

  <script src="config.js"></script>
  <script src="gl.js"></script>
  <script src="art.js"></script>
  <script src="app.js"></script>
</body>
</html>
